version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20.9.0
        - nvm use 20.9.0
        - node -v
        - corepack enable
        - pnpm -v
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - ~/.pnpm-store/**/*
